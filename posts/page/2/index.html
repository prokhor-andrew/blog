  <style>
    :root {
      color-scheme: light dark;
      --background: #ffffff;
      --text: #000000;
      --muted: #6a655d;
      --link: var(--text);
      --rule: #ddd6c8;
      --code: #f1eadc;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #151513;
        --text: #ece6d8;
        --muted: #aaa293;
        --link: var(--text);
        --rule: #38342e;
        --code: #24211c;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 18px;
      line-height: 1.65;
    }

    main {
      width: min(100% - 32px, 680px);
      margin: 48px auto 72px;
    }

    header {
      margin-bottom: 48px;
      border-bottom: 1px solid var(--rule);
      padding-bottom: 20px;
    }

    h1,
    h2,
    h3,
    h4 {
      line-height: 1.2;
      margin: 0 0 12px;
      font-weight: 700;
    }

    h1 {
      font-size: 34px;
    }

    h2 {
      margin-top: 44px;
      font-size: 24px;
    }

    h3 {
      margin-top: 32px;
      font-size: 21px;
    }

    p {
      margin: 0 0 20px;
    }

    a {
      color: var(--link);
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
      margin-top: 18px;
      font-size: 16px;
    }

    ul {
      margin: 0 0 20px;
      padding-left: 24px;
    }

    li {
      margin: 10px 0;
    }

    time,
    .muted {
      color: var(--muted);
    }

    .intro {
      margin-top: 18px;
      color: var(--muted);
      font-size: 17px;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .post-list {
      list-style: none;
      padding: 0;
    }

    .contact-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    .contact-table th,
    .contact-table td {
      padding: 6px 0;
      text-align: left;
      vertical-align: middle;
    }

    .contact-table th {
      width: 112px;
      font-size: 15px;
      font-weight: 400;
      color: var(--muted);
      white-space: nowrap;
    }

    .contact-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .contact-link svg {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      color: currentColor;
    }

    .more-link {
      display: inline-block;
      margin-top: 4px;
      font-size: 16px;
    }

    .post-list li {
      display: grid;
      grid-template-columns: 112px 1fr;
      gap: 14px;
      align-items: baseline;
      margin: 12px 0;
    }

    .post-list time {
      font-size: 15px;
      white-space: nowrap;
    }

    pre,
    code {
      background: var(--code);
      border-radius: 4px;
    }

    code {
      padding: 1px 4px;
      font-size: 0.92em;
    }

    pre {
      overflow-x: auto;
      padding: 14px 16px;
    }

    pre code {
      padding: 0;
      background: transparent;
    }

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4px;
      margin-top: 44px;
    }

    .pagination-page {
      min-width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      text-decoration: none;
      font-size: 16px;
    }

    .pagination-current {
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .pagination-ellipsis {
      min-width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 16px;
    }

    .post-title {
      margin-top: 0;
    }

    footer {
      border-top: 1px solid var(--rule);
      margin-top: 56px;
      padding-top: 20px;
      font-size: 15px;
      color: var(--muted);
    }

    @media (max-width: 520px) {
      body {
        font-size: 17px;
      }

      main {
        margin-top: 28px;
      }

      h1 {
        font-size: 30px;
      }

      .post-list li {
        grid-template-columns: 1fr;
        gap: 0;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Andrii Prokhorenko</h1>
      <nav aria-label="Primary navigation">
        <a href="/">Home</a>
        <a href="/posts/">Posts</a>
        <a href="/contacts/">Contacts</a>
      </nav>
      
    </header>

    <section aria-labelledby="posts">
      <h2 id="posts">Posts</h2>
      
      <ul class="post-list">
        <li>
          <time datetime="2026-05-15">May 15, 2026</time>
          <a href="/posts/vim-part-0/">Vim Part 0</a>
        </li>
      </ul>
      <nav class="pagination" aria-label="Pagination">
        <a class="pagination-page" href="/posts/">1</a>
        <span class="pagination-page pagination-current" aria-current="page">2</span>
      </nav>
    </section>

    <footer>
      <p>&copy; 2026 Andrii Prokhorenko.</p>
    </footer>
  </main>
</body>
</html>
